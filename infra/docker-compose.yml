services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      API_KEY: ${API_KEY:-}
    volumes:
      - stalecheck_data:/data
    restart: unless-stopped

volumes:
  stalecheck_data:
