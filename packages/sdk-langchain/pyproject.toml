[project]
name = "stalecheck-langchain"
version = "1.0.0"
description = "LangChain callback handler adapter for StaleCheck"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3.0",
  "stalecheck>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stalecheck_langchain"]
