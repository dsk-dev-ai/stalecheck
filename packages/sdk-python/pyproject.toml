[project]
name = "stalecheck"
version = "1.0.0"
description = "Python SDK and CLI for StaleCheck: catch stale answers before users do"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.scripts]
stalecheck = "stalecheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stalecheck"]
