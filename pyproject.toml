[project]
name = "stalecheck-workspace"
version = "0.1.0"
description = "StaleCheck monorepo: API, SDK/CLI, dashboard and evals"
requires-python = ">=3.11"
dependencies = ["stalecheck", "stalecheck-api", "stalecheck-langchain"]

[tool.uv.workspace]
members = ["apps/api", "packages/sdk-python", "packages/sdk-langchain"]

[tool.uv.sources]
stalecheck = { workspace = true }
"stalecheck-api" = { workspace = true }
"stalecheck-langchain" = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/sdk-python/stalecheck/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/sdk-python/tests"]
pythonpath = ["apps/api", "packages/sdk-python"]
addopts = "-q"
