services:
  - type: web
    name: stalecheck-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: API_KEY
        sync: false
